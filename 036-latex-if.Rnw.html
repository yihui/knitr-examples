<pre><code class="language-markdown">\documentclass{article}
\newif\ifmyboolean
\begin{document}

&lt;&lt;setup&gt;&gt;=
myboolean='true' # or set it to 'false'
@
% assign true or false to myboolean
\myboolean\Sexpr{myboolean}

\ifmyboolean
hello, foo!
\else
hey, bar!
\fi

\end{document}</code></pre>
