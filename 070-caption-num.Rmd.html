<pre><code class="language-markdown"># Incremental Figure Numbers

```{r setup, include=FALSE}
fn = local({
  i = 0
  function(x) {
    i &lt;&lt;- i + 1
    paste('Figure ', i, ': ', x, sep = '')
  }
})
```

```{r test-a, fig.cap=fn('this is one plot')}
plot(1:10)
```

```{r test-b, fig.cap=fn('another plot')}
plot(rnorm(10))
```</code></pre>
