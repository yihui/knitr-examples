<pre><code class="language-markdown">We can draw plots in a loop.

```{r loop, results='asis', fig.cap=rep('',5)}
for (i in 1:5) {
  cat('\n\nthis is plot ', i, '\n\n')
  plot(1:i)
}
```</code></pre>
