title: Error traceback with rlang
---

For code using **rlang** errors directly, clean traceback should be shown too.

```{r, error = FALSE}
f &lt;- function() g()
g &lt;- function() h()
h &lt;- function() rlang::abort("This is an error !")
f()
```</code></pre>
