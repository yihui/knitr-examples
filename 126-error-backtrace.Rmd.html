title: Error traceback with rlang
---

This should be automatically entrace by rlang when it is installed, and a clean traceback will be shown. 

```{r, error = FALSE}
f &lt;- function() g()
g &lt;- function() h()
h &lt;- function() stop("This is an error !")
f()
```</code></pre>
