<html><head><meta charset="utf-8">
<title>011-conditional-eval.Rnw</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
<style>body{margin:0} pre{margin:0;padding:.6em;white-space:pre-wrap;word-break:break-word}</style>
</head><body>
<pre><code class="language-markdown">\documentclass{article}

\begin{document}

&lt;&lt;controller&gt;&gt;=
# this variable controls if a chunk should be evaluated
dothis &lt;- TRUE
@

&lt;&lt;chunk1, eval = dothis&gt;&gt;=
print('say hello world')
@

&lt;&lt;chunk2, eval = !dothis&gt;&gt;=
print('silence is gold')
@

\end{document}</code></pre>
