<pre><code class="language-markdown"># Pass variables to bash scripts

Use `Sys.setenv()`:

```{r}
Sys.setenv(EXAMPLES = 'example/path')
```

Now we write a `bash` code chunk:

```{r engine='bash'}
echo $EXAMPLES
```

It works.</code></pre>
